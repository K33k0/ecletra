<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">RunZone — find your rhythm</title>
  <desc id="description">Android GPS running tracker with Bluetooth heart-rate zones. The heart-rate card is an interface illustration using sample data.</desc>
  <rect width="1280" height="420" rx="28" fill="#101819"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="54" y="48" width="56" height="56" rx="15" fill="#c2f970"/>
    <path d="M72 87V72q0-9 9-9h5m6 26 10-29" fill="none" stroke="#101819" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="90" fill="#f2f5ee" font-size="42" font-weight="700" letter-spacing="-1">RunZone</text>
    <text x="54" y="191" fill="#f2f5ee" font-size="58" font-weight="700" letter-spacing="-2">Find your rhythm.</text>
    <text x="57" y="237" fill="#a9bcb4" font-size="24">GPS runs. Bluetooth heart rate. Your zones.</text>
    <rect x="56" y="281" width="144" height="38" rx="19" fill="#24352a"/>
    <text x="128" y="306" text-anchor="middle" fill="#c2f970" font-size="14" font-weight="700" letter-spacing="1">ANDROID 8+</text>
    <text x="219" y="306" fill="#a9bcb4" font-size="15">No RunZone account needed</text>
    <text x="57" y="378" fill="#82998f" font-size="13">Set your target. Get a nudge when you drift outside it.</text>
    <rect x="822" y="44" width="404" height="312" rx="26" fill="#1b2627" stroke="#30403e"/>
    <circle cx="850" cy="79" r="5" fill="#c2f970"/>
    <text x="865" y="84" fill="#c2f970" font-size="13" font-weight="700" letter-spacing="1.5">LIVE HEART RATE</text>
    <text x="847" y="203" fill="#f2f5ee" font-size="100" letter-spacing="-4">142</text>
    <text x="1012" y="202" fill="#a9bcb4" font-size="23">bpm</text>
    <text x="1198" y="173" text-anchor="end" fill="#f2f5ee" font-size="22">120–150</text>
    <text x="1198" y="199" text-anchor="end" fill="#a9bcb4" font-size="11" letter-spacing="1">TARGET BPM</text>
    <rect x="848" y="233" width="350" height="7" rx="3.5" fill="#30403e"/>
    <rect x="965" y="233" width="116" height="7" rx="3.5" fill="#c2f970"/>
    <circle cx="1050" cy="236.5" r="7" fill="#f2f5ee"/>
    <text x="849" y="281" fill="#c2f970" font-size="18">In your zone · keep this rhythm</text>
    <text x="849" y="316" fill="#a9bcb4" font-size="13">Heart-rate sensor connected</text>
    <text x="1024" y="382" text-anchor="middle" fill="#82998f" font-size="12">Interface illustration · sample data</text>
  </g>
</svg>
